[package]
name = "tinnitus"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
audio.workspace = true
env_logger.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
icons.workspace = true
library.workspace = true
log.workspace = true
state.workspace = true
ui.workspace = true
views.workspace = true

# The taskbar progress bar. Both are already in the graph under gpui_windows,
# so this costs a feature union rather than a build.
[target.'cfg(windows)'.build-dependencies]
# Compiles assets/tinnitus.ico into the executable as icon resource 1, which is the
# one GPUI loads onto the window.
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# A thumbnail-toolbar click lands in the window procedure, which is no place to
# touch a GPUI entity. It is sent down a channel and applied on the executor.
futures = "0.3"
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
